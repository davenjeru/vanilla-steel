# Live evals on the verified cases only. Costs money (Claude for the system, OpenAI for the judge),
# so it runs on two occasions: a pull request against main (all four evals, so the change is seen to pass
# before it merges) and by hand, Actions > Live evals > Run workflow, with a choice of eval.
# Results go to Confident AI, linked to the dataset alias of each manifest version (D44); a failed deterministic
# check fails the run, judged metrics only report (D35). Secrets reach a pull request only from this
# repository's own branches, never from a fork.
name: Live evals

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      eval:
        description: Which eval to run live
        type: choice
        default: all
        options: [all, extraction, duplicates, agent, quote_letter]

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

env:
  # A pull request has no inputs: it runs every eval.
  EVAL: ${{ inputs.eval || 'all' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
  # Send every trace before the job ends, or DeepEval drops the ones still uploading.
  CONFIDENT_TRACE_FLUSH: "1"
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # caps the cost of a run that hangs or loops
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        id: install
        run: uv sync --locked

      - name: Extraction eval (live, verified cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["all", "extraction"]'), env.EVAL) }}
        run: uv run python -m evals.run extraction --verified-only

      - name: Duplicates eval (live, verified cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["all", "duplicates"]'), env.EVAL) }}
        run: uv run python -m evals.run duplicates --verified-only

      - name: Agent eval (live, verified cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["all", "agent"]'), env.EVAL) }}
        run: uv run python -m evals.run agent --verified-only

      - name: Quote-letter eval (live, verified cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["all", "quote_letter"]'), env.EVAL) }}
        run: uv run python -m evals.run quote_letter --verified-only
