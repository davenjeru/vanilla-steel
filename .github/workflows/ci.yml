# Free checks on every push and pull request: lint, unit and API tests, and the matcher's golden cases.
# No API keys, no model calls, no upload. The evals call live models and run on request (live-evals.yml, D43).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        id: install
        run: uv sync --locked

      - name: Lint, unit and API tests
        run: make check
